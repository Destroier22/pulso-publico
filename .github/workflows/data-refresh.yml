name: Atualizar dados públicos

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Importar, limpar e validar
        run: node pipeline/refresh-data.mjs
      - name: Testar regras de qualidade
        run: npm test
      - name: Publicar snapshot atualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "dados: atualizar snapshot do Siconfi"
          file_pattern: data/snapshot.json
